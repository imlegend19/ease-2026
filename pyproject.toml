[project]
name = "ease-2026"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "python-dotenv",
    "pymongo",
    "rbo",
    "rpy2",
    "scikit-learn",
    "scipy",
    "seaborn",
    "structlog",
    "upsetplot",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
