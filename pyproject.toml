[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ease-2026"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pymongo>=4.10.0",
  "python-dotenv>=1.0.1",
  "structlog>=25.4.0",
]

[dependency-groups]
dev = [
  "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ease2026*"]
